<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホロカ 新カード情報まとめ</title>
<style>
  :root { --gold: #d4af6a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(ellipse at top, #1c2740, #0a0e18);
    color: #f0e6d2; font-family: "Hiragino Sans","Yu Gothic",sans-serif; padding: 24px;
  }
  .headerRow { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 4px; }
  .topBar { display: none; }

  /* ===== サイト共通ヘッダーナビ（ページ間の遷移用） ===== */
  .siteNav {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 90;
    margin: -24px -24px 20px; padding: 14px 24px;
    background: linear-gradient(90deg, #141b2e, #1c2740);
    border-bottom: 1px solid rgba(212,175,106,0.35);
  }
  .siteNav .siteNavLogo {
    font-weight: 800; font-size: 15px; color: var(--gold); letter-spacing: 0.5px;
    margin-right: 18px; text-decoration: none; white-space: nowrap;
  }
  .siteNav .siteNavLinks { display: flex; gap: 6px; flex-wrap: wrap; }
  .siteNav a.siteNavLink {
    color: #c9d1e0; text-decoration: none; font-size: 13px; font-weight: bold;
    padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; transition: all 0.15s;
    white-space: nowrap;
  }
  .siteNav a.siteNavLink:hover { color: var(--gold); border-color: rgba(212,175,106,0.35); background: rgba(212,175,106,0.08); }
  .siteNav a.siteNavLink.active { color: #1a1305; background: var(--gold); border-color: var(--gold); }
  .siteNavYoutubeBtn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #ff3d3d, #d90000); color: #fff; text-decoration: none;
    padding: 8px 16px 8px 12px; border-radius: 22px; font-size: 12.5px; font-weight: bold;
    box-shadow: 0 3px 12px rgba(255,0,0,0.5); animation: ytPulse 2.4s ease-in-out infinite;
    transition: transform 0.15s ease; white-space: nowrap; flex-shrink: 0;
  }
  .siteNavYoutubeBtn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .siteNavYoutubeBtn:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(255,0,0,0.7); }
  @media (max-width: 640px) {
    .siteNav {
      flex-wrap: wrap; margin: -24px -24px 16px; padding: 12px 16px; row-gap: 10px;
    }
    .siteNav .siteNavLogo { order: 1; margin-right: 0; }
    .siteNavYoutubeBtn { order: 2; margin-left: auto; padding: 7px 14px 7px 10px; font-size: 11.5px; }
    .siteNavYoutubeBtn svg { width: 14px; height: 14px; }
    .siteNav .siteNavLinks { order: 3; width: 100%; }
  }

  @keyframes ytPulse {
    0%, 100% { box-shadow: 0 3px 12px rgba(255,0,0,0.5), 0 0 0 0 rgba(255,0,0,0.45); }
    50% { box-shadow: 0 3px 12px rgba(255,0,0,0.5), 0 0 0 8px rgba(255,0,0,0); }
  }
  h1 { text-align: center; font-size: 28px; letter-spacing: 1.5px; margin: 0; font-weight: 800; }
  .sub { text-align: center; color: #9aa5c0; font-size: 12px; margin-bottom: 10px; }
  .adSlotWrap {
    max-width: 728px; margin: 0 auto 10px; min-height: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .controlsRow {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch;
    gap: 14px; margin-bottom: 8px;
  }
  .setSelectWrap, .searchWrap {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(160deg, #1a2233, #10182a);
    border: 1px solid rgba(212,175,106,0.35); border-radius: 14px;
    padding: 8px 16px; box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  .controlsRow .icon { font-size: 14px; opacity: 0.75; flex-shrink: 0; }
  .setSelectWrap select {
    padding: 4px 4px; border: none; background: transparent; color: #f0e6d2; font-size: 13px;
    outline: none; cursor: pointer;
  }
  .setSelectWrap select option { background: #10182a; }
  .searchWrap input {
    width: 280px; max-width: 50vw; padding: 4px 4px; border: none;
    background: transparent; color: #f0e6d2; font-size: 13px; outline: none;
  }
  .searchWrap input::placeholder { color: #6b7690; }
  .searchHint { text-align: center; color: #9aa5c0; font-size: 11px; margin: 0 0 26px; width: 100%; }

  .favWrap { position: relative; }
  .sizeFavGroup { display: flex; align-items: center; gap: 8px; }
  .favMenuBtn {
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(160deg, #1a2233, #10182a); color: #f0e6d2;
    border: 1px solid rgba(212,175,106,0.35); border-radius: 14px;
    padding: 8px 16px; font-size: 13px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  .favMenuBtn.active { background: linear-gradient(135deg, var(--gold), #a97c3e); color: #1a1305; border-color: var(--gold); }
  .favMenuBtn:hover { border-color: var(--gold); }
  .favMenu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 40;
    background: linear-gradient(160deg, #1a2233, #10182a); border: 1px solid rgba(212,175,106,0.4);
    border-radius: 12px; padding: 12px; min-width: 220px; box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  .favGroupRow {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 4px; border-bottom: 1px solid rgba(212,175,106,0.15); font-size: 13px;
  }
  .favGroupRow:last-child { border-bottom: none; }
  .favGroupRow.active .favGroupName { color: var(--gold); font-weight: bold; }
  .favGroupName { cursor: pointer; flex: 1; }
  .favGroupRow button {
    background: none; border: 1px solid rgba(212,175,106,0.3); color: #9aa5c0;
    border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }
  .favGroupRow button:hover { border-color: var(--gold); color: var(--gold); }
  .favMenuActions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .favMenuActions button {
    width: 100%; padding: 6px; border-radius: 8px; border: 1px solid rgba(212,175,106,0.35);
    background: transparent; color: #f0e6d2; font-size: 12px; cursor: pointer;
  }
  .favMenuActions button:hover { border-color: var(--gold); color: var(--gold); }
  .favEmptyHint { font-size: 12px; color: #9aa5c0; padding: 6px 4px; }

  .favStar {
    position: absolute; top: 6px; right: 6px; z-index: 3;
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: rgba(10,14,24,0.6); color: #fff; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .favStar.active { background: var(--gold); color: #1a1305; }

  /* 新着カードの強調表示 */
  .card.isNew {
    border-color: #ff3d3d;
    box-shadow: 0 0 0 2px rgba(255,61,61,0.55), 0 4px 14px rgba(0,0,0,0.4);
    animation: newCardPulse 2s ease-in-out infinite;
  }
  @keyframes newCardPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,61,61,0.55), 0 4px 14px rgba(0,0,0,0.4); }
    50% { box-shadow: 0 0 0 5px rgba(255,61,61,0.25), 0 4px 14px rgba(0,0,0,0.4); }
  }
  .newBadge {
    position: absolute; top: 6px; left: 6px; z-index: 3;
    background: linear-gradient(135deg, #ff5a5a, #d90000); color: #fff;
    font-size: 9px; font-weight: bold; letter-spacing: 0.5px;
    padding: 2px 7px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  section.typeArea { max-width: 1200px; margin: 0 auto 40px; }
  .typeHeader {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    border-bottom: 1px solid rgba(212,175,106,0.3); padding-bottom: 6px; flex-wrap: wrap;
  }
  .typeHeader h2 { font-size: 16px; margin: 0; color: var(--gold); }
  .typeHeader .count { font-size: 12px; color: #9aa5c0; }
  .sortControl { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .sortControl .sortLabel { font-size: 11px; color: #9aa5c0; }
  .sortControl select.sortSelect {
    background: #10182a; color: var(--text); border: 1px solid rgba(212,175,106,0.35);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  .sortControl select.sortSelect:hover { border-color: var(--gold); }
  .sortDirBtn {
    background: #10182a; color: var(--gold); border: 1px solid rgba(212,175,106,0.35);
    border-radius: 6px; width: 26px; height: 26px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 12px; line-height: 1; transition: transform 0.15s, border-color 0.15s;
  }
  .sortDirBtn:hover { border-color: var(--gold); }
  .sortDirBtn.desc { transform: rotate(180deg); }
  .sortDivider {
    align-self: stretch; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding-top: 4px; min-width: 0;
  }
  .sortDivider .sortDividerLine {
    width: 2px; flex: 1 1 auto; min-height: 36px; background: rgba(212,175,106,0.55); border-radius: 1px;
  }
  .sortDivider .sortDividerLabel {
    margin-top: 6px; font-size: 11px; font-weight: bold; color: var(--gold); white-space: nowrap;
  }
  #grid-新規, #grid-再録, #grid-パラレル, #searchResultsGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cardMin, 150px), 1fr)); gap: var(--cardGap, 16px);
  }
  body.size-small { --cardMin: 96px; --cardGap: 10px; }
  body.size-small .card:not(.empty) .card-body { display: none; }
  body.size-medium .card:not(.empty) .metaAttr,
  body.size-medium .card:not(.empty) .metaNumber { display: none; }
  body.size-small .card:not(.empty) .favStar { display: none; }
  body.size-large { --cardMin: 220px; --cardGap: 22px; }
  .sizeToggle { display: flex; align-items: center; gap: 4px; }
  .sizeToggle button {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(212,175,106,0.35);
    background: #10182a; color: #9aa5c0; cursor: pointer; display: flex;
    align-items: center; justify-content: center; padding: 6px;
  }
  .sizeToggle button svg { width: 100%; height: 100%; }
  .sizeToggle button.active { background: var(--gold); color: #1a1305; border-color: var(--gold); }
  .sizeToggle button:hover:not(.active) { border-color: var(--gold); color: var(--gold); }
  .card {
    background: linear-gradient(160deg, #1a2233, #10182a); border-radius: 12px;
    border: 1px solid rgba(212,175,106,0.35); overflow: hidden; position: relative;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4); transition: box-shadow 0.15s, border-color 0.15s; cursor: pointer;
    display: flex; flex-direction: column;
  }
  @media (hover: hover) {
    .card:hover { box-shadow: 0 4px 20px rgba(212,175,106,0.35); border-color: rgba(212,175,106,0.7); }
  }
  .card img { width: 100%; aspect-ratio: 5/7; flex: none; object-fit: cover; display: block; background: #10182a; }
  .card-body { padding: 8px 10px; flex-shrink: 0; }
  .name { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
  .meta { font-size: 10px; color: #9aa5c0; }
  .tag {
    display: inline-block; font-size: 9px; color: #1a1305; background: var(--gold);
    padding: 1px 7px; border-radius: 8px; margin-bottom: 4px;
  }

  .card.empty {
    aspect-ratio: 5/7; display: flex; align-items: center; justify-content: center;
    border: 1px dashed rgba(212,175,106,0.3); background: rgba(255,255,255,0.02); cursor: default;
  }
  .card.empty:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.4); border-color: rgba(212,175,106,0.3); }
  .card.empty .slotNum { color: rgba(212,175,106,0.35); font-size: 26px; font-weight: bold; }

  #loading, #emptyAll, #noResults { text-align: center; color: #9aa5c0; margin-top: 60px; }

  .modalOverlay {
    display: none; position: fixed; inset: 0; background: rgba(5,8,14,0.9);
    z-index: 100; align-items: center; justify-content: center; padding: 24px;
  }
  .modalOverlay.open { display: flex; }
  .modalBox {
    background: linear-gradient(160deg, #1a2233, #10182a); border: 1px solid rgba(212,175,106,0.4);
    border-radius: 18px; max-width: 1180px; width: 100%; max-height: 94vh; overflow-y: auto;
    display: flex; gap: 32px; padding: 36px; position: relative; flex-wrap: wrap;
  }
  /* 画像＋ダウンロードボタンをひとまとめにして、情報欄をスクロールしても中央に固定表示させる */
  .modalImageCol {
    position: sticky; top: 0; align-self: flex-start; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px; width: 420px; max-width: 100%;
  }
  #modalImg { width: 420px; max-width: 100%; aspect-ratio: 5/7; object-fit: contain; background: #10182a; border-radius: 14px; cursor: zoom-in; }
  .imageZoomOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400;
    align-items: center; justify-content: center; cursor: zoom-out; padding: 20px; box-sizing: border-box;
  }
  .imageZoomOverlay.open { display: flex; }
  .imageZoomOverlay img { max-width: 96vw; max-height: 96vh; width: auto; height: auto; border-radius: 14px; box-shadow: 0 20px 70px rgba(0,0,0,0.8); }
  .modalInfo { flex: 1; min-width: 260px; }
  .modalInfo h3 { margin: 0 0 12px; font-size: 28px; color: var(--gold); }
  .modalInfo .modalMeta { font-size: 15px; color: #9aa5c0; margin-bottom: 6px; }
  .modalInfo .modalAbility { margin-top: 16px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .numHighlight { font-weight: 900; color: var(--gold); }
  .modalTypeBadge {
    display: inline-block; font-size: 12px; font-weight: bold; color: #1a1305;
    background: var(--gold); padding: 3px 12px; border-radius: 10px; margin-bottom: 10px; margin-right: 6px;
  }
  .modalClose {
    position: absolute; top: 14px; right: 18px; z-index: 3;
    background: rgba(10,14,24,0.65); border: 1px solid rgba(212,175,106,0.4);
    color: #f0e6d2; font-size: 22px; cursor: pointer; line-height: 1;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .modalClose:hover { background: rgba(10,14,24,0.9); border-color: var(--gold); }
  .modalNavBtn {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 101;
    background: rgba(212,175,106,0.15); border: 1px solid rgba(212,175,106,0.4);
    color: var(--gold); width: 48px; height: 48px; border-radius: 50%;
    font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modalNavBtn:hover { background: rgba(212,175,106,0.3); }
  .modalNavBtn.prev { left: 24px; }
  .modalNavBtn.next { right: 24px; }
  .modalDownloadBtn {
    width: 100%; justify-content: center;
    background: var(--gold); color: #1a1305; border: none; border-radius: 20px;
    padding: 10px 18px; font-size: 13px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .modalDownloadBtn:hover { filter: brightness(1.1); }
  .artsBlock {
    border-top: 1px dashed rgba(212,175,106,0.25); margin-top: 12px; padding-top: 10px;
  }
  .artsBlock .artsName {
    display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: bold; color: #f0e6d2;
  }
  .artsYellIcons { flex-shrink: 0; min-width: 0; }
  .artsNameText { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; min-width: 0; }
  .artsDamageGroup { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; text-align: right; }
  .artsDamageText { font-size: 26px; font-weight: bold; color: #f0e6d2; }
  .artsBlock .artsMeta { font-size: 13px; color: #9aa5c0; margin: 2px 0; }
  .artsBlock .artsEffect { font-size: 26px; line-height: 1.6; white-space: pre-wrap; margin-top: 6px; }

  .modalBadgeRow { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .modalFavStar {
    position: absolute; right: 150px; bottom: 20px; margin-left: 0;
    width: 34px; height: 34px; background: rgba(255,255,255,0.08); font-size: 17px; top: auto;
  }
  .skillBlock {
    display: flex; flex-direction: column;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed rgba(212,175,106,0.2);
  }
  .skillBlock:last-child { border-bottom: none; }
  .skillBannerRow { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .skillBannerImg { height: 40px; width: auto; max-width: 220px; object-fit: contain; display: block; flex-shrink: 0; }
  .skillTitleInline { font-size: 26px; font-weight: bold; color: #f0e6d2; flex: 1; text-align: center; -webkit-text-stroke: 0.6px #fff; paint-order: stroke fill; white-space: nowrap; overflow: hidden; min-width: 0; }
  .skillTitle { font-size: 15px; font-weight: bold; color: #f0e6d2; margin-bottom: 4px; text-align: right; white-space: nowrap; overflow: hidden; }

  .extraBox {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border: 2px solid var(--gold); border-radius: 10px; padding: 10px 16px; margin-bottom: 8px;
    background: rgba(212,175,106,0.06);
  }
  .extraLabel { font-size: 22px; font-weight: bold; color: #d4af37; text-shadow: 0 0 6px rgba(212,175,55,0.4); flex-shrink: 0; }
  .extraContent { font-size: 17px; color: #f0e6d2; line-height: 1.5; white-space: pre-wrap; }

  .specialSkillBox { padding: 3px; border-radius: 12px; margin-bottom: 8px; }
  .specialSkillInner {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    background: #10182a; border-radius: 9px; padding: 10px 16px;
  }
  .specialSkillLabel { font-size: 20px; font-weight: bold; color: #fff; flex-shrink: 0; }
  .specialSkillName { font-size: 20px; font-weight: bold; color: #f0e6d2; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; min-width: 0; }
  .modalAbility.skillContentLarge { font-size: 26px; }

  .limitedBanner {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, #7a1414, #4a0a0a);
    border-top: 2px solid #e05252; border-bottom: 2px solid #e05252;
    border-radius: 4px; padding: 9px 16px; margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .limitedBannerText {
    color: #fff; font-weight: bold; font-size: 17px; letter-spacing: 0.02em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .ratingSection {
    display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap;
    margin-top: 20px; padding-top: 16px; border-top: 1px dashed rgba(212,175,106,0.25);
  }
  .ratingChart { flex-shrink: 0; }
  .ratingComment { flex: 1; min-width: 180px; }
  .ratingCommentLabel { font-size: 13px; color: #9aa5c0; margin-bottom: 6px; }
  .ratingCommentText { font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .ratingScoreBox { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 8px; }
  .ratingScoreRow {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 8px 12px; border-radius: 8px; background: rgba(212,175,106,0.06);
    border: 1px solid rgba(212,175,106,0.18);
  }
  .ratingScoreLabel { font-size: 12px; color: #9aa5c0; }
  .ratingScoreValue { font-size: 16px; font-weight: bold; color: #f0e6d2; }
  .ratingScoreValue small { font-size: 11px; font-weight: normal; color: #9aa5c0; }
  .ratingScoreRow.ratingScoreMain {
    background: linear-gradient(90deg, rgba(212,175,106,0.18), rgba(212,175,106,0.05));
    border-color: rgba(212,175,106,0.45);
  }
  .ratingScoreRow.ratingScoreMain .ratingScoreValue { color: var(--gold); font-size: 20px; }
  .ratingScoreBox .ratingCommentText { font-size: 13px; color: #c9d1e0; margin-top: 2px; }
  .yellRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .yellIconWrap { position: relative; display: inline-flex; width: 28px; height: 28px; }
  .specialAtkInline { display: inline-flex; align-items: center; gap: 2px; margin-left: 10px; vertical-align: middle; }
  .specialAtkDamage {
    font-size: 28px; line-height: 28px; font-weight: 900;
    -webkit-text-stroke: 1.5px #fff; paint-order: stroke fill;
  }
  .yellIconWrap img { width: 100%; height: 100%; object-fit: contain; }
  .yellFallback { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #1a1305; display: block; }
  .yellCount {
    position: absolute; bottom: -4px; right: -6px; background: #1a1305; color: #f0e6d2;
    font-size: 10px; font-weight: bold; border-radius: 8px; padding: 0 4px; line-height: 1.4;
  }
  .batonIcons { display: inline-flex; gap: 3px; vertical-align: middle; }
  .batonIcon { width: 18px; height: 18px; object-fit: contain; }

  /* ===== 関連カード読み込み中のスピナー ===== */
  .relatedLoadingSpinner {
    display: inline-block; width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(212,175,106,0.25); border-top-color: var(--gold);
    animation: relatedSpin 0.7s linear infinite; flex-shrink: 0;
  }
